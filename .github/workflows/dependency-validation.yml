name: Dependency validation

# 既存のビルド + 回帰テストを検証する。起動条件:
# - main への push と全ての PR (通常の変更でテストが走らない状態を避ける)
# - 手動実行
# - release.yml からの呼び出し (workflow_call): 署名・R2 配信より前に必ず通し、失敗したら配信しない
# 署名と配信は対象外で、release.yml 側で行う。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify R2 transfer fixtures
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x
      - name: Restore
        run: |
          dotnet restore VStoVSC.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          dotnet build VStoVSC.slnx -c Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test tests/VStoVSC.Tests/VStoVSC.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
